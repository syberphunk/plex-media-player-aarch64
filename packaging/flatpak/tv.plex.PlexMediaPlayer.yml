app-id: tv.plex.PlexMediaPlayer
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk

base: io.qt.qtwebengine.BaseApp
base-version: '6.11'

command: plexmediaplayer
rename-desktop-file: plexmediaplayer.desktop
rename-icon: plexmediaplayer

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --device=input
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-pictures:ro
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.login1

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        path: ../../vendor-deps/libass-0.17.5.tar.gz
        sha256: caab4b993dd7be6187c55623b789ed75dddefea6e65938af134637c732fe094a

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dglslang=disabled
      - -Ddemos=false
    sources:
      - type: archive
        path: ../../vendor-deps/libplacebo-v7.349.0.tar.gz
        sha256: 1c52a60ccf71ca8276029dacee63ab027a70929ec1ea3a763557bfb10fd33ef8

  - name: libmpv
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dmanpage-build=disabled
      - -Dlua=disabled
      - -Dlibarchive=disabled
      - -Dvaapi=enabled
      - -Ddrm=enabled
      - -Degl=enabled
      - -Dgl=enabled
    sources:
      - type: archive
        path: ../../vendor-deps/mpv-0.39.0.tar.gz
        sha256: 2ca92437affb62c2b559b4419ea4785c70d023590500e8a52e95ea3ab4554683

  - name: minizip
    buildsystem: autotools
    subdir: contrib/minizip
    config-opts:
      - --disable-static
    sources:
      - type: archive
        path: ../../vendor-deps/zlib-1.3.1.tar.gz
        sha256: 9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23
      - type: shell
        commands:
          - cd contrib/minizip && autoreconf -fiv

  - name: plex-media-player
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DQTROOT=/usr
      - -DCMAKE_PREFIX_PATH=/app;/usr
      - -DQT_ADDITIONAL_PACKAGES_PREFIX_PATH=/app
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DENABLE_CODECS=OFF
      - -DWEB_CLIENT_UNPACKED_DIR=/run/build/plex-media-player/web-client
    sources:
      - type: dir
        path: ../..
      - type: file
        url: https://downloads.plex.tv/plex-desktop/1.115.0.426-4e960a1d/linux_tarball/Plex-1.115.0.426-4e960a1d-linux-x86_64.tar.bz2
        sha256: 5d0d7a7e0e3daf87174b335f2fa7933bb15893c1d686f5744160056f6e64081f
        dest-filename: plex-desktop-linux.tar.bz2
      - type: shell
        commands:
          - mkdir plex-desktop
          - tar -xjf plex-desktop-linux.tar.bz2 -C plex-desktop ./resources/web-client
          - python3 scripts/stage-web-client.py plex-desktop/resources/web-client web-client
          - python3 scripts/verify-web-client.py web-client
          - rm -rf plex-desktop plex-desktop-linux.tar.bz2
