app-id: io.github.syberphunk.PlexMediaPlayer
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk

base: io.qt.qtwebengine.BaseApp
base-version: '6.11'

command: plexmediaplayer
rename-desktop-file: plexmediaplayer.desktop
rename-icon: plexmediaplayer

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --device=input
  - --device=all
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-download:create
  - --filesystem=/opt/steamvr:ro
  - --filesystem=xdg-config/openxr:ro
  - --filesystem=xdg-config/openvr:ro
  - --filesystem=~/.steam:ro
  - --filesystem=xdg-data/Steam/userdata
  - --filesystem=xdg-data/flatpak/exports/share/icons:ro
  - --filesystem=/var/lib/flatpak/exports/share/icons:ro
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.login1

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        path: ../../vendor-deps/libass-0.17.5.tar.gz
        sha256: caab4b993dd7be6187c55623b789ed75dddefea6e65938af134637c732fe094a

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dglslang=disabled
      - -Ddemos=false
    sources:
      - type: archive
        path: ../../vendor-deps/libplacebo-v7.360.1.tar.gz
        sha256: 41893531edad334905886c9b5778751db2ec1b78d51c4ecc272057c92bc678a5

  - name: hwdata
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --datadir=/app/share --disable-blacklist
      - make install
    cleanup:
      - '*'
    sources:
      - type: archive
        path: ../../vendor-deps/hwdata-0.412.tar.gz
        sha256: f0c64cd7e31d70a5fb3a52e53ab50a61e74c0421a6381eaa45114eec3bde5fe7

  - name: libdisplay-info
    buildsystem: meson
    config-opts:
      - --libdir=lib
    cleanup:
      - /bin
    sources:
      - type: archive
        path: ../../vendor-deps/libdisplay-info-0.4.0.tar.xz
        sha256: 43b180baa143e2035654759d84e2b2f5ee77d5fe817c423838c7fe59c0d68459

  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --libdir=/app/lib --enable-shared --disable-static
        --disable-programs --disable-doc --enable-gpl --enable-gnutls --enable-vaapi
        --enable-libdrm --enable-libdav1d
      - make -j${FLATPAK_BUILDER_N_JOBS:-4}
      - make install
    cleanup:
      - /share/ffmpeg
    sources:
      - type: archive
        path: ../../vendor-deps/ffmpeg-9.0.2.tar.xz
        sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e

  - name: libmpv
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dmanpage-build=disabled
      - -Dlua=disabled
      - -Dlibarchive=disabled
      - -Dvaapi=enabled
      - -Ddrm=enabled
      - -Degl=enabled
      - -Dgl=enabled
    sources:
      - type: archive
        path: ../../vendor-deps/mpv-0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  - name: openxr-loader
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DDYNAMIC_LOADER=ON
      - -DBUILD_TESTS=OFF
      - -DBUILD_API_LAYERS=OFF
      - -DBUILD_WITH_SYSTEM_JSONCPP=OFF
      - -DBUILD_WITH_WAYLAND_HEADERS=OFF
      - -DBUILD_WITH_XLIB_HEADERS=ON
      - -DBUILD_WITH_XCB_HEADERS=OFF
    sources:
      - type: archive
        path: ../../vendor-deps/openxr-sdk-1.1.65.tar.gz
        sha256: 27aa797baf680c5f836b6138e78e59e2f72d6becfef6d4587ed9a57756d6d3b3

  - name: minizip
    buildsystem: autotools
    subdir: contrib/minizip
    config-opts:
      - --disable-static
    sources:
      - type: archive
        path: ../../vendor-deps/zlib-1.3.1.tar.gz
        sha256: 9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23
      - type: shell
        commands:
          - cd contrib/minizip && autoreconf -fiv

  - name: plex-media-player
    buildsystem: cmake-ninja
    build-options:
      cflags: -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -fstack-clash-protection -mbranch-protection=standard
      cxxflags: -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -fstack-clash-protection -mbranch-protection=standard
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DQTROOT=/usr
      - -DCMAKE_PREFIX_PATH=/app;/usr
      - -DQT_ADDITIONAL_PACKAGES_PREFIX_PATH=/app
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DENABLE_CODECS=OFF
      - -DWEB_CLIENT_PROVIDED_AT_RUNTIME=ON
    post-install:
      - install -Dm755 /run/build/plex-media-player/scripts/apply_extra /app/bin/apply_extra
      - install -Dm755 /run/build/plex-media-player/scripts/stage-web-client.py /app/libexec/plexmediaplayer/stage-web-client.py
      - install -Dm755 /run/build/plex-media-player/scripts/verify-web-client.py /app/libexec/plexmediaplayer/verify-web-client.py
      - install -Dm644 /run/build/plex-media-player/packaging/flatpak/io.github.syberphunk.PlexMediaPlayer.metainfo.xml
        /app/share/metainfo/io.github.syberphunk.PlexMediaPlayer.metainfo.xml
      - mkdir -p /app/share/plexmediaplayer
      - ln -s ../../extra/web-client /app/share/plexmediaplayer/web-client
    sources:
      - type: dir
        path: ../..
      - type: extra-data
        filename: plex-desktop.tar.bz2
        url: https://downloads.plex.tv/plex-desktop/1.115.0.426-4e960a1d/linux_tarball/Plex-1.115.0.426-4e960a1d-linux-x86_64.tar.bz2
        sha256: 5d0d7a7e0e3daf87174b335f2fa7933bb15893c1d686f5744160056f6e64081f
        size: 211737936
        installed-size: 42719972
