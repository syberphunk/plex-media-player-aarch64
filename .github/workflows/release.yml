name: release

on:
  push:
    tags:
      - 'v*-aarch64.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
      allow_outdated:
        description: Build even if a newer upstream release exists
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      ARCH: aarch64
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb ffmpeg

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check pinned sources
        run: ./scripts/check-sources.py

      - name: Resolve the release arguments
        id: args
        run: |
          set -eu
          args="--arch $ARCH --gh-repo ${{ github.repository }}"
          if [ -n "${{ inputs.tag }}" ]; then
            args="$args --tag ${{ inputs.tag }}"
          else
            args="$args --tag ${GITHUB_REF_NAME}"
          fi
          if [ "${{ inputs.allow_outdated }}" != "false" ]; then
            args="$args --allow-outdated"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Build and verify
        run: ./scripts/release.sh ${{ steps.args.outputs.args }} --no-publish

      - name: Attest the bundle's build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: plex-media-player-${{ env.ARCH }}.flatpak

      - name: Publish
        run: ./scripts/release.sh ${{ steps.args.outputs.args }} --publish-only
