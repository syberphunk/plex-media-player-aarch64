name: release

on:
  push:
    tags:
      - 'v*-aarch64.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
      allow_outdated:
        description: Build even if a newer upstream release exists
        type: boolean
        default: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      ARCH: aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install build tools
        run: |
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb ffmpeg

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Report runner facts
        run: |
          uname -a
          getconf PAGE_SIZE
          nproc
          free -m
          df -h /dev/shm /tmp
          sysctl kernel.unprivileged_userns_clone vm.max_map_count || true

      - name: Check pinned sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-sources.py

      - name: Resolve the release arguments
        id: args
        env:
          REPOSITORY: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_ALLOW_OUTDATED: ${{ inputs.allow_outdated }}
        run: |
          set -eu
          if [ -n "$INPUT_TAG" ]; then
            tag=$INPUT_TAG
          else
            tag=$GITHUB_REF_NAME
          fi
          case $tag in
            v[0-9]*-aarch64.[0-9]*) ;;
            *) echo "refusing tag: $tag" >&2; exit 1 ;;
          esac
          case $tag in
            *[!0-9A-Za-z.-]*) echo "refusing tag: $tag" >&2; exit 1 ;;
          esac
          args="--arch $ARCH --gh-repo $REPOSITORY --tag $tag"
          if [ "$INPUT_ALLOW_OUTDATED" != "false" ]; then
            args="$args --allow-outdated"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          ARGS: ${{ steps.args.outputs.args }}
          RELEASE_TAG: ${{ steps.args.outputs.tag }}
        run: ./scripts/release.sh $ARGS --build-only

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -eu
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "GPG_PRIVATE_KEY is not set" >&2; exit 1; }
          d="$RUNNER_TEMP/gnupg"
          mkdir -p "$d"
          chmod 700 "$d"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --homedir "$d" --batch --import
          echo "FP_GPG_HOMEDIR=$d" >> "$GITHUB_ENV"

      - name: Sign, package and verify
        env:
          ARGS: ${{ steps.args.outputs.args }}
          QTWEBENGINE_CHROMIUM_FLAGS: >-
            --no-sandbox
            --enable-logging=stderr --log-level=0
        run: ./scripts/release.sh $ARGS --from-build --no-publish

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: facade-verify-${{ env.ARCH }}
          path: |
            facade-verify-${{ env.ARCH }}.png
            facade-verify-${{ env.ARCH }}.log
          if-no-files-found: warn
          retention-days: 7

      - name: Attest the artifact's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: plex-media-player-${{ env.ARCH }}-repo.tar.gz

      - name: Publish
        env:
          ARGS: ${{ steps.args.outputs.args }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh $ARGS --publish-only

      - name: Stage the repository for Pages
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          ./scripts/stage-pages.sh "$(dirname "$GITHUB_WORKSPACE")/fp-repo" \
            "https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}" \
            pages

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: pages
          include-hidden-files: true

  pages:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  verify-pages:
    needs: pages
    uses: ./.github/workflows/verify-pages.yml
    with:
      url: ${{ needs.pages.outputs.url }}
