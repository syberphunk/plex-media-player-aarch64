name: release

on:
  push:
    tags:
      - 'v*-aarch64.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
      allow_outdated:
        description: Build even if a newer upstream release exists
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      ARCH: aarch64
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb ffmpeg \
            qemu-user-static binfmt-support

      - name: Register qemu binfmt handlers
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Check pinned sources
        run: ./scripts/check-sources.py

      - name: Build, verify and publish
        run: |
          set -eu
          args="--arch $ARCH --gh-repo ${{ github.repository }}"
          if [ -n "${{ inputs.tag }}" ]; then
            args="$args --tag ${{ inputs.tag }}"
          else
            args="$args --tag ${GITHUB_REF_NAME}"
          fi
          if [ "${{ inputs.allow_outdated }}" != "false" ]; then
            args="$args --allow-outdated"
          fi
          ./scripts/release.sh $args

      - name: Attest the bundle's build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: plex-media-player-${{ env.ARCH }}.flatpak

      - name: Upload the verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facade-verify-aarch64
          path: facade-verify-*.log
          if-no-files-found: ignore
