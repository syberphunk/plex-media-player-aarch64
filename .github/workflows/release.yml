name: release

on:
  push:
    tags:
      - 'v*-aarch64.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
      allow_outdated:
        description: Build even if a newer upstream release exists
        type: boolean
        default: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      ARCH: aarch64
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb ffmpeg

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Report runner facts
        run: |
          uname -a
          getconf PAGE_SIZE
          nproc
          free -m
          df -h /dev/shm /tmp
          sysctl kernel.unprivileged_userns_clone vm.max_map_count || true

      - name: Check pinned sources
        run: ./scripts/check-sources.py

      - name: Resolve the release arguments
        id: args
        run: |
          set -eu
          args="--arch $ARCH --gh-repo ${{ github.repository }}"
          if [ -n "${{ inputs.tag }}" ]; then
            args="$args --tag ${{ inputs.tag }}"
          else
            args="$args --tag ${GITHUB_REF_NAME}"
          fi
          if [ "${{ inputs.allow_outdated }}" != "false" ]; then
            args="$args --allow-outdated"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -eu
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "GPG_PRIVATE_KEY is not set" >&2; exit 1; }
          d="$RUNNER_TEMP/gnupg"
          mkdir -p "$d"
          chmod 700 "$d"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --homedir "$d" --batch --import
          echo "FP_GPG_HOMEDIR=$d" >> "$GITHUB_ENV"

      - name: Build and verify
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: >-
            --no-sandbox
            --enable-logging=stderr --log-level=0
        run: ./scripts/release.sh ${{ steps.args.outputs.args }} --no-publish

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: facade-verify-${{ env.ARCH }}
          path: |
            facade-verify-${{ env.ARCH }}.png
            facade-verify-${{ env.ARCH }}.log
          if-no-files-found: warn
          retention-days: 7

      - name: Attest the artifact's build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: plex-media-player-${{ env.ARCH }}-repo.tar.gz

      - name: Publish
        run: ./scripts/release.sh ${{ steps.args.outputs.args }} --publish-only

      - name: Stage the repository for Pages
        run: |
          set -eu
          ./scripts/stage-pages.sh "$(dirname "$GITHUB_WORKSPACE")/fp-repo" \
            "https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}" \
            pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  pages:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  verify-pages:
    needs: pages
    uses: ./.github/workflows/verify-pages.yml
    with:
      url: ${{ needs.pages.outputs.url }}
