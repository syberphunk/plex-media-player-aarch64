name: build

on:
  workflow_dispatch:
    inputs:
      allow_outdated:
        description: Build even if a newer upstream release exists
        type: boolean
        default: true
      release_tag:
        description: Release tag to bake into the build, for testing update checks
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      ARCH: aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install build tools
        run: |
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb ffmpeg

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check pinned sources
        run: ./scripts/check-sources.py

      - name: Resolve the build arguments
        id: args
        env:
          INPUT_ALLOW_OUTDATED: ${{ inputs.allow_outdated }}
        run: |
          set -eu
          args="--arch $ARCH"
          if [ "$INPUT_ALLOW_OUTDATED" != "false" ]; then
            args="$args --allow-outdated"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          ARGS: ${{ steps.args.outputs.args }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./scripts/release.sh $ARGS --build-only

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -eu
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "GPG_PRIVATE_KEY is not set" >&2; exit 1; }
          d="$RUNNER_TEMP/gnupg"
          mkdir -p "$d"
          chmod 700 "$d"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --homedir "$d" --batch --import
          echo "FP_GPG_HOMEDIR=$d" >> "$GITHUB_ENV"

      - name: Sign, package and verify
        env:
          ARGS: ${{ steps.args.outputs.args }}
          QTWEBENGINE_CHROMIUM_FLAGS: >-
            --no-sandbox
            --enable-logging=stderr --log-level=0
        run: ./scripts/release.sh $ARGS --from-build --no-publish

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: plex-media-player-${{ env.ARCH }}-repo
          path: plex-media-player-${{ env.ARCH }}-repo.tar.gz
          if-no-files-found: error
          retention-days: 14

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: facade-verify-${{ env.ARCH }}
          path: |
            facade-verify-${{ env.ARCH }}.png
            facade-verify-${{ env.ARCH }}.log
          if-no-files-found: warn
          retention-days: 7
