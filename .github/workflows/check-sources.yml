name: check-sources

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'packaging/flatpak/**'
      - 'vendor-deps/**'
      - 'scripts/check-sources.py'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify pins and probe upstream
        run: |
          set -o pipefail
          ./scripts/check-sources.py --deep | tee check-sources.out

      - name: Summarise
        if: always()
        run: |
          {
            echo '```'
            cat check-sources.out || echo "the check produced no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
